
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Classifier | AI Project</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
        }

        h1 {
            color: #166534;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        input {
            margin: 20px 0;
            width: 100%;
        }

        img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin: 15px 0;
            display: none;
            object-fit: contain;
        }

        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #166534;
        }

        #status {
            font-size: 14px;
            margin-top: 15px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍌 AI Fruit Classifier 🍊</h1>

    <p>
        
    Upload an image and let Artificial Intelligence
    identify whether it is an Apple, Banana, Cherry, Mango,
    Kiwi, Orange, Strawberry, Grapes or Chickoo.

    </p>

    <p id="status">Loading AI model...</p>

    <input type="file" id="imageUpload" accept="image/*">

    <img id="preview" alt="Uploaded fruit preview">

    <br>

    <button id="predictButton" disabled>
        Predict Fruit
    </button>

    <div id="result"></div>

    <div id="footer" class="footer">
        Powered by Google Teachable Machine and TensorFlow.js
    </div>

</div>

<script>

    const MODEL_URL =
        "https://teachablemachine.withgoogle.com/models/Lg3BibCkv/";

    let model;
    let imageReady = false;

    const upload = document.getElementById("imageUpload");
    const preview = document.getElementById("preview");
    const button = document.getElementById("predictButton");
    const result = document.getElementById("result");
    const status = document.getElementById("status");

    async function loadModel() {
        try {
            model = await tmImage.load(
                MODEL_URL + "model.json",
                MODEL_URL + "metadata.json"
            );

            status.textContent = "AI Model Loaded Successfully!";
        } catch (error) {
            status.textContent =
                "Unable to load model. Please refresh the page.";
            console.error(error);
        }
    }

    upload.addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            status.textContent = "Please select a valid image.";
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

            preview.onload = function() {
                imageReady = true;
                button.disabled = !model;
                result.textContent = "";
                status.textContent = "Image uploaded successfully!";
            };

            preview.src = e.target.result;
            preview.style.display = "inline-block";
        };

        reader.readAsDataURL(file);
    });

    button.addEventListener("click", async function() {

        if (!model || !imageReady) return;

        button.disabled = true;
        result.textContent = "Analysing image...";

        try {
            const predictions = await model.predict(preview);

            predictions.sort(
                (a, b) => b.probability - a.probability
            );

            const best = predictions[0];

            result.innerHTML =
                "Prediction: " + best.className +
                "<br>Confidence: " +
                (best.probability * 100).toFixed(2) + "%";

        } catch (error) {
            result.textContent = "Prediction failed. Try another image.";
            console.error(error);
        }

        button.disabled = false;
    });

    loadModel();

</script>

</body>
</html>
